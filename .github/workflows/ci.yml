name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore ViteKlub.slnx

      - name: Verify formatting
        run: dotnet format ViteKlub.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build ViteKlub.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ViteKlub.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  build-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore ViteKlub.slnx

      - name: Publish static application
        run: >-
          dotnet publish src/ViteKlub.Web/ViteKlub.Web.csproj
          --configuration Release
          --no-restore
          --output artifacts/pages

      - name: Prepare GitHub Pages files
        run: scripts/prepare-github-pages.sh artifacts/pages/wwwroot "${GITHUB_REPOSITORY#*/}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/pages/wwwroot
          include-hidden-files: true

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
